<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Life">
<title>My Life at a Glance</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="auth" id="auth" hidden>
  <div class="box">
    <h1>My Life ❤️</h1>
    <p>Sign in to see your dashboard.</p>
    <div class="setup" id="setup" hidden>Add your Firebase settings to <b>public/firebase-config.js</b> first (see README).</div>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button class="primary" id="signin">Sign in</button>
    <button class="ghost" id="signup">Create account</button>
    <button class="ghost" id="google">Continue with Google</button>
    <button class="ghost" id="github">Continue with GitHub</button>
    <div class="err" id="autherr" role="alert"></div>
    <div class="setup" id="diag" style="color:#8b90a0"></div>
  </div>
</div>
<div id="app" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
